  <!-- Mango de la lupa -->
  <line x1="61" y1="59" x2="82" y2="80" stroke="#e9e4d8" stroke-width="7" stroke-linecap="round"/>

  <!-- Asientos (3 rectángulos redondeados pequeños) -->
