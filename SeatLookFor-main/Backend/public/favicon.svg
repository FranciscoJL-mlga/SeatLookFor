  <rect x="39" y="36" width="8" height="10" rx="2" fill="#e9e4d8"/>
  <rect x="50" y="38" width="8" height="10" rx="2" fill="#e9e4d8"/>

  <!-- Persona sentada (simplificada) -->
  <circle cx="43" cy="32" r="4" fill="#e9e4d8"/>
  <line x1="43" y1="36" x2="43" y2="48" stroke="#e9e4d8" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="43" y1="48" x2="36" y2="54" stroke="#e9e4d8" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="43" y1="48" x2="50" y2="54" stroke="#e9e4d8" stroke-width="2.5" stroke-linecap="round"/>
</svg>
